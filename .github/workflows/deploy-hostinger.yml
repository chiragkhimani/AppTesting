name: Build & Deploy (Hostinger Shared SSH)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: deploy-hostinger-main
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Build frontend (Yarn)
        working-directory: frontend
        env:
          REACT_APP_API_BASE: /playground/api
        run: |
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://chiragkhimani.in/playground

    env:
      HOSTINGER_HOST: 193.203.185.67
      HOSTINGER_PORT: "65002"
      HOSTINGER_USER: u922767486
      HOSTINGER_TARGET: /home/u922767486/domains/chiragkhimani.in/public_html/playground

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}

      - name: Add Hostinger to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${HOSTINGER_PORT}" "${HOSTINGER_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy build to Hostinger (rsync over SSH)
        run: |
          rsync -az --delete \
            --exclude 'api/' \
            --exclude 'swagger/' \
            --exclude '.htaccess' \
            -e "ssh -p ${HOSTINGER_PORT}" \
            frontend/build/ \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:${HOSTINGER_TARGET}/"

      - name: Deploy PHP API to Hostinger (rsync over SSH)
        run: |
          rsync -az --delete \
            -e "ssh -p ${HOSTINGER_PORT}" \
            hostinger-deploy/api/ \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:${HOSTINGER_TARGET}/api/"

      - name: Deploy Swagger docs to Hostinger (rsync over SSH)
        run: |
          rsync -az --delete \
            -e "ssh -p ${HOSTINGER_PORT}" \
            hostinger-deploy/swagger/ \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:${HOSTINGER_TARGET}/swagger/"

      - name: Deploy .htaccess to Hostinger (scp over SSH)
        run: |
          scp -P "${HOSTINGER_PORT}" \
            hostinger-deploy/.htaccess \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:${HOSTINGER_TARGET}/.htaccess"

  smoke-ui-tests:
    name: Smoke UI (TestNG + Selenium)
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
      checks: write
      pages: write
      id-token: write

    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4
        with:
          repository: chiragkhimani/TestNGAutomation-CC
          ref: master

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Xvfb (virtual display for headed Chrome)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Maven smoke tests (prod playground)
        run: xvfb-run -a mvn -B install

      - name: Generate Allure HTML report
        if: success() || failure()
        run: |
          ALLURE_VERSION=2.27.0
          curl -sLo allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz
          ./allure-${ALLURE_VERSION}/bin/allure generate target/allure-results -o allure-report --clean

      - name: Publish test results (GitHub Checks)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: success() || failure()
        with:
          check_name: Smoke UI automation (TestNG)
          files: target/surefire-reports/TEST-*.xml
          comment_mode: off

      - name: Publish Allure report to GitHub Pages
        if: success() || failure()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: automation-reports/latest
          keep_files: true

      - name: Job summary (Allure report)
        if: success() || failure()
        env:
          REPORT_URL: https://chiragkhimani.github.io/AppTesting/automation-reports/latest/index.html
        run: |
          {
            echo "## UI automation report (Allure)"
            echo ""
            echo "**[Open latest Allure report](${REPORT_URL})** — timelines, suites, and failure screenshots."
            echo ""
            echo "Also download the **allure-report** artifact if GitHub Pages is not enabled yet."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Allure report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
