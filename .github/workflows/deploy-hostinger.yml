name: Build & Deploy (Hostinger Shared SSH)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: deploy-hostinger-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      HOSTINGER_HOST: 217.21.91.171
      HOSTINGER_PORT: "65002"
      HOSTINGER_USER: u797308362
      HOSTINGER_TARGET: /home/u797308362/domains/seleniumbootcamp.cloud/public_html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Build frontend (Yarn)
        working-directory: frontend
        run: |
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}

      - name: Add Hostinger to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${HOSTINGER_PORT}" "${HOSTINGER_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy build to Hostinger (rsync over SSH)
        run: |
          # Deploy the React build output, but keep server-managed folders/files
          # like /api and /.htaccess that are deployed separately below.
          rsync -az --delete \
            --exclude 'api/' \
            --exclude '.htaccess' \
            -e "ssh -p ${HOSTINGER_PORT}" \
            frontend/build/ \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:${HOSTINGER_TARGET}/"

      - name: Deploy PHP API to Hostinger (rsync over SSH)
        run: |
          rsync -az --delete \
            -e "ssh -p ${HOSTINGER_PORT}" \
            hostinger-deploy/api/ \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:${HOSTINGER_TARGET}/api/"

      - name: Deploy .htaccess to Hostinger (scp over SSH)
        run: |
          scp -P "${HOSTINGER_PORT}" \
            hostinger-deploy/.htaccess \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:${HOSTINGER_TARGET}/.htaccess"

